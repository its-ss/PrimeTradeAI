databases:
  - name: primetrade-db
    plan: free
    databaseName: primetrade
    user: primetrade

services:
  # ── Backend Web Service ──────────────────────────────────────────────────────
  - type: web
    name: primetrade-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: primetrade-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://primetradeai-1-zegb.onrender.com

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: primetrade-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback — all routes serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://primetradeai-l00y.onrender.com/api/v1
